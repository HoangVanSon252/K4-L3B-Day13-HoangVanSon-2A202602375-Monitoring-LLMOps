alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602375
    runbook: docs/alerts.md#alert-1-highlatencyp95
  - name: LowRetrievalSuccess
    severity: critical
    condition: retrieval_success_rate < 90
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602375
    runbook: docs/alerts.md#alert-2-lowretrievalsuccess
  - name: HighCostSpike
    severity: warning
    condition: daily_cost_usd > 2.5
    duration: 1h
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602375
    runbook: docs/alerts.md#alert-3-highcostspike